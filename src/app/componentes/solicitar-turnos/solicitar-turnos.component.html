<title>Solicitar turnos</title>
<h1>Solicitar turno</h1>

<!-- Seleccionar especialidad -->
<section>
  <label for="especialidad">Especialidad</label>
  <select [(ngModel)]="especialidadSeleccionada" (change)="onSelect()">
    <option [ngValue]="null" disabled selected>-- Seleccione una especialidad --</option>
    <option *ngFor="let especialidad of especialidades" [ngValue]="especialidad">
      {{ especialidad.nombre }}
    </option>
  </select>
</section>

<!-- Seleccionar especialista -->
<section>
  <label for="especialista">Especialista</label>
  <select [(ngModel)]="especialistaSeleccionado" (change)="onCambiarEspecialista()">
    <option [ngValue]="null" disabled selected>-- Seleccione un especialista --</option>
    <option *ngFor="let especialista of especialistas" [ngValue]="especialista">
      {{ especialista.apellido }}, {{ especialista.nombre }}
    </option>
  </select>
</section>

<!-- Seleccionar paciente (si es administrador) -->
<section *ngIf="esAdministrador">
  <label for="paciente">Paciente</label>
  <select [(ngModel)]="pacienteSeleccionado">
    <option [ngValue]="null" disabled selected>-- Seleccione un paciente --</option>
    <option *ngFor="let p of pacientes" [ngValue]="p">
      {{ p.apellido }}, {{ p.nombre }}
    </option>
  </select>
</section>

<!-- Fechas disponibles -->
<section *ngIf="proximosDias.length > 0" class="dias-disponibles">
  <label>Seleccioná una fecha:</label>
  <div class="botones-fecha">
    <button *ngFor="let dia of proximosDias" (click)="seleccionarFecha(dia)">
      {{ dia | date: 'EEEE d/M' }}
    </button>
  </div>
</section>

<!-- Horarios disponibles -->
<section *ngIf="fechaSeleccionada">
  <label>Horarios disponibles para {{ fechaSeleccionada | date: 'fullDate' }}:</label>
  <div class="grid-bloques">
    <ng-container *ngFor="let h of obtenerHorariosParaFechaSeleccionada()">
      <div *ngFor="let bloque of generarBloques(h.hora_inicio, h.hora_fin)" class="bloque-item">
        {{ bloque }}
        <button 
          (click)="onSolicitarTurno(h.dia_semana, bloque)" 
          [disabled]="bloqueOcupado(bloque) || esBloquePasado(bloque)"
          [ngClass]="{
            'btn-ocupado': bloqueOcupado(bloque),
            'btn-pasado': esBloquePasado(bloque)
          }"
          [title]="
            bloqueOcupado(bloque)
              ? 'Este horario ya fue reservado'
              : esBloquePasado(bloque)
                ? 'Este horario ya pasó'
                : 'Disponible'
          ">
          {{
            bloqueOcupado(bloque) || esBloquePasado(bloque)
              ? 'No disponible'
              : 'Solicitar'
          }}
        </button>
      </div>
    </ng-container>
  </div>
</section>

<!-- Mensaje de resultado -->
<div *ngIf="mensajeTurno" [ngClass]="{
  'mensaje-exito': tipoMensajeTurno === 'exito',
  'mensaje-error': tipoMensajeTurno === 'error'
}">
  {{ mensajeTurno }}
</div>

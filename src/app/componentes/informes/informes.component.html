<title>Informes</title>
<div class="container mt-5">

    <div class="row g-3 justify-content-center">
      <div class="col-md-4 col-sm-6">
        <button class="btn btn-primary w-100" [routerLink]="['logs']">
          📋 Log de ingresos
        </button>
      </div>
      <div class="col-md-4 col-sm-6">
        <button class="btn btn-info w-100" [routerLink]="['turnos-especialidad']">
          🩺 Turnos por especialidad
        </button>
      </div>
      <div class="col-md-4 col-sm-6">
        <button class="btn btn-success w-100" [routerLink]="['turnos-por-dia']">
          📅 Turnos por día
        </button>
      </div>
      <div class="col-md-4 col-sm-6">
        <button class="btn btn-warning w-100" [routerLink]="['turnos-por-medio']">
          📨 Turnos por medio (lapso)
        </button>
      </div>
      <div class="col-md-4 col-sm-6">
        <button class="btn btn-secondary w-100" [routerLink]="['turnos-finalizados']">
